<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#170f2e;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:16px;
}
#app{width:100%;max-width:520px;text-align:center}
h1{font-size:42px;margin:5px 0 15px;font-weight:900}
p{color:#bbb;margin:6px 0 14px}
input,button{
font:inherit;
border:0;
border-radius:12px;
padding:14px;
}
input{
width:100%;
margin-bottom:10px;
background:#fff;
color:#111;
}
button{cursor:pointer;font-weight:800}
.primary{background:#2fd8ff;color:#07121a;width:100%}
.secondary{background:#30234f;color:#fff}
.hidden{display:none!important}
.room{
background:#21163d;
border-radius:18px;
padding:20px;
margin-top:15px;
}
.roomCode{
font-size:32px;
font-weight:900;
letter-spacing:5px;
margin:12px 0;
}
.copy{
background:#ffa81f;
color:#17100a;
width:100%;
}
.scores{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:12px;
}
.score{
flex:1;
padding:12px;
border-radius:14px;
background:#21163d;
font-weight:900;
}
.cyan{color:#2fd8ff}
.orange{color:#ffa81f}
canvas{
display:block;
width:min(92vw,440px);
height:min(92vw,440px);
max-width:440px;
max-height:440px;
margin:10px auto;
background:#0d091b;
border:3px solid #4a3b70;
border-radius:12px;
image-rendering:pixelated;
}
.controls{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
max-width:340px;
margin:14px auto;
}
.controls button{
height:64px;
font-size:27px;
background:#30234f;
color:white;
}
.controls button:active{transform:scale(.95)}
.controls .up{grid-column:2}
.controls .left{grid-column:1;grid-row:2}
.controls .down{grid-column:2;grid-row:2}
.controls .right{grid-column:3;grid-row:2}
.status{
min-height:25px;
font-weight:800;
margin:8px;
}
.voiceBox{
background:#21163d;
border-radius:15px;
padding:12px;
margin:12px 0;
}
.voiceBtn{
width:100%;
background:#30234f;
color:#fff;
}
.voiceBtn.on{
background:#2fd8ff;
color:#07121a;
}
.voiceStatus{
display:block;
font-size:13px;
margin-top:8px;
color:#aaa;
}
.voiceStatus.good{color:#5cff9d}
.voiceStatus.bad{color:#ff7070}
.countdown{
font-size:72px;
font-weight:900;
margin:15px;
}
.result{
background:#21163d;
padding:20px;
border-radius:18px;
margin-top:15px;
}
.result h2{font-size:30px;margin:5px}
#roomInput{text-transform:uppercase}
.small{font-size:13px;color:#999}
</style>
</head>

<body>
<div id="app">

<h1>⚡ LIGHT DUEL</h1>

<div id="menu">
<p>Real-time multiplayer light battle</p>
<input id="nameInput" maxlength="16" placeholder="Your name">
<input id="roomInput" maxlength="4" placeholder="Room code (join)">
<button class="primary" id="createBtn">CREATE ROOM</button>
<br><br>
<button class="secondary" id="joinBtn">JOIN ROOM</button>
<div class="small">Create a room or enter a 4-character code to join.</div>
</div>

<div id="roomScreen" class="room hidden">
<div>Your Room</div>
<div class="roomCode" id="roomCode">----</div>
<button class="copy" id="copyBtn">📋 COPY CODE</button>
<p id="roomStatus">Waiting for another player...</p>
</div>

<div id="game" class="hidden">

<div class="scores">
<div class="score cyan">
<span id="p1Name">CYAN</span><br>
<span id="p1Score">0</span>
</div>
<div class="score orange">
<span id="p2Name">ORANGE</span><br>
<span id="p2Score">0</span>
</div>
</div>

<div id="speed" class="small">SPEED: 1x</div>

<div class="voiceBox">
<button class="voiceBtn" id="voiceBtn">🎙️ VOICE OFF</button>
<span class="voiceStatus" id="voiceStatus">
Voice ready when both players join
</span>
</div>

<canvas id="board" width="44" height="44"></canvas>

<div class="controls" id="controls">
<button class="up" data-dir="up">⬆️</button>
<button class="left" data-dir="left">⬅️</button>
<button class="down" data-dir="down">⬇️</button>
<button class="right" data-dir="right">➡️</button>
</div>

<div id="status" class="status"></div>

<div id="countdown" class="countdown hidden"></div>

<div id="result" class="result hidden">
<h2 id="resultText"></h2>
<button class="primary" id="againBtn">PLAY AGAIN</button>
</div>

</div>
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menu");
const roomScreen=document.getElementById("roomScreen");
const game=document.getElementById("game");

const nameInput=document.getElementById("nameInput");
const roomInput=document.getElementById("roomInput");

const createBtn=document.getElementById("createBtn");
const joinBtn=document.getElementById("joinBtn");
const copyBtn=document.getElementById("copyBtn");

const roomCodeEl=document.getElementById("roomCode");
const roomStatus=document.getElementById("roomStatus");
const statusEl=document.getElementById("status");

const p1Name=document.getElementById("p1Name");
const p2Name=document.getElementById("p2Name");
const p1Score=document.getElementById("p1Score");
const p2Score=document.getElementById("p2Score");

const speedEl=document.getElementById("speed");
const countdown=document.getElementById("countdown");
const result=document.getElementById("result");
const resultText=document.getElementById("resultText");
const againBtn=document.getElementById("againBtn");

const voiceBtn=document.getElementById("voiceBtn");
const voiceStatus=document.getElementById("voiceStatus");

const SIZE=44;

let ws=null;
let player=null;
let room="";
let myName="";
let players=[];
let gameState=null;
let gameRunning=false;

let localStream=null;
let peer=null;
let voiceEnabled=false;
let remoteAudio=null;
let iceQueue=[];
let remoteDescriptionSet=false;

const rtcConfig={
  iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"}
  ]
};

function serverURL(){
  const protocol=location.protocol==="https:"?"wss":"ws";
  return protocol+"://"+location.host;
}

function connect(){
  ws=new WebSocket(serverURL());

  ws.onopen=()=>{
    statusEl.textContent="Connected";
  };

  ws.onmessage=e=>{
    let msg;
    try{
      msg=JSON.parse(e.data);
    }catch{
      return;
    }
    handle(msg);
  };

  ws.onclose=()=>{
    statusEl.textContent="Disconnected from server";
    stopVoice();
  };

  ws.onerror=()=>{
    statusEl.textContent="Connection error";
  };
}

function send(msg){
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify(msg));
  }
}

function createRoom(){
  myName=(nameInput.value.trim()||"Player").slice(0,16);

  connect();

  setTimeout(()=>{
    send({
      type:"create",
      name:myName
    });
  },300);
}

function joinRoom(){
  room=roomInput.value.trim().toUpperCase();

  if(room.length!==4){
    alert("Enter a 4-character room code.");
    return;
  }

  myName=(nameInput.value.trim()||"Player").slice(0,16);

  connect();

  setTimeout(()=>{
    send({
      type:"join",
      room,
      name:myName
    });
  },300);
}

function handle(m){

  if(m.type==="room-created"){
    room=m.room;
    player=m.player;

    roomCodeEl.textContent=room;
    menu.classList.add("hidden");
    roomScreen.classList.remove("hidden");

    roomStatus.textContent="Waiting for another player...";
    return;
  }

  if(m.type==="joined"){
    room=m.room;
    player=m.player;

    roomCodeEl.textContent=room;

    menu.classList.add("hidden");
    roomScreen.classList.remove("hidden");

    roomStatus.textContent="Joined room. Waiting for game...";
    return;
  }

  if(m.type==="players"){
    players=m.players||[];

    if(players.length>=2){
      roomStatus.textContent="Both players connected!";
      showGame();
    }

    updateNames();
    return;
  }

  if(m.type==="game-start"){
    showGame();
    startCountdown();
    return;
  }

  if(m.type==="state"){
    gameState=m.state;
    drawGame();
    updateNames();
    return;
  }

  if(m.type==="round-result"){
    statusEl.textContent=m.message||"Round finished";
    return;
  }

  if(m.type==="match-result"){
    result.classList.remove("hidden");
    resultText.textContent=(m.winner||"Player")+" WINS! 🎉🎉";
    gameRunning=false;
    return;
  }

  if(m.type==="opponent_left"){
    statusEl.textContent="Opponent left the game.";
    stopVoice();
    return;
  }

  if(m.type==="voice-ready"){
    voiceStatus.textContent="Opponent ready — connecting voice...";
    voiceStatus.className="voiceStatus";

    if(voiceEnabled && player===0){
      makeOffer();
    }
    return;
  }

  if(m.type==="voice-off"){
    voiceStatus.textContent="Opponent turned voice off";
    voiceStatus.className="voiceStatus";
    return;
  }

  if(m.type==="voice-offer"){
    handleOffer(m.offer);
    return;
  }

  if(m.type==="voice-answer"){
    handleAnswer(m.answer);
    return;
  }

  if(m.type==="voice-ice"){
    handleIce(m.candidate);
    return;
  }

  if(m.type==="voice-peer-left"){
    voiceStatus.textContent="Opponent voice disconnected";
    voiceStatus.className="voiceStatus";
    closePeerOnly();
    return;
  }
}

function showGame(){
  roomScreen.classList.add("hidden");
  game.classList.remove("hidden");
  updateNames();
}

function updateNames(){
  if(!players.length)return;

  const a=players[0];
  const b=players[1];

  if(a){
    p1Name.textContent=(a.name||"CYAN").toUpperCase();
    p1Score.textContent=a.score||0;
  }

  if(b){
    p2Name.textContent=(b.name||"ORANGE").toUpperCase();
    p2Score.textContent=b.score||0;
  }
}

function startCountdown(){
  countdown.classList.remove("hidden");

  let n=3;
  countdown.textContent=n;

  const timer=setInterval(()=>{
    n--;

    if(n>0){
      countdown.textContent=n;
    }else{
      clearInterval(timer);
      countdown.textContent="GO!";
      setTimeout(()=>{
        countdown.classList.add("hidden");
        gameRunning=true;
      },500);
    }
  },700);
}

function drawGame(){

  ctx.clearRect(0,0,SIZE,SIZE);

  ctx.fillStyle="#0d091b";
  ctx.fillRect(0,0,SIZE,SIZE);

  ctx.strokeStyle="rgba(255,255,255,.06)";
  ctx.lineWidth=.08;

  for(let i=0;i<=SIZE;i++){
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i,SIZE);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i);
    ctx.lineTo(SIZE,i);
    ctx.stroke();
  }

  if(!gameState)return;

  const trails=gameState.trails||[];
  const heads=gameState.players||[];

  trails.forEach(t=>{
    ctx.fillStyle=t.player===0?"#2fd8ff":"#ffa81f";

    if(Array.isArray(t.cells)){
      t.cells.forEach(c=>{
        ctx.fillRect(c.x,c.y,1,1);
      });
    }
  });

  heads.forEach(p=>{
    ctx.fillStyle="#fff";
    ctx.shadowColor=p.player===0?"#2fd8ff":"#ffa81f";
    ctx.shadowBlur=6;
    ctx.fillRect(p.x,p.y,1,1);
    ctx.shadowBlur=0;
  });

  const s=gameState.speed||1;
  speedEl.textContent="SPEED: "+s+"x";
}

function queueTurn(dir){
  if(!ws || ws.readyState!==WebSocket.OPEN)return;

  send({
    type:"turn",
    direction:dir
  });
}

document.querySelectorAll(".controls button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    queueTurn(btn.dataset.dir);
  });
});

document.addEventListener("keydown",e=>{
  if(game.classList.contains("hidden"))return;

  const k=e.key.toLowerCase();

  if(player===0){
    if(k==="w")queueTurn("up");
    if(k==="a")queueTurn("left");
    if(k==="s")queueTurn("down");
    if(k==="d")queueTurn("right");
  }

  if(player===1){
    if(e.key==="ArrowUp")queueTurn("up");
    if(e.key==="ArrowDown")queueTurn("down");
    if(e.key==="ArrowLeft")queueTurn("left");
    if(e.key==="ArrowRight")queueTurn("right");
  }
});

copyBtn.addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(room);
    copyBtn.textContent="✅ COPIED!";
    setTimeout(()=>{
      copyBtn.textContent="📋 COPY CODE";
    },1500);
  }catch{
    prompt("Copy this room code:",room);
  }
});

createBtn.addEventListener("click",createRoom);
joinBtn.addEventListener("click",joinRoom);

againBtn.addEventListener("click",()=>{
  result.classList.add("hidden");
  send({type:"next"});
});

async function toggleVoice(){

  if(voiceEnabled){
    stopVoice();
    send({type:"voice-off"});
    voiceStatus.textContent="Voice OFF";
    voiceStatus.className="voiceStatus";
    return;
  }

  voiceBtn.disabled=true;
  voiceStatus.textContent="Requesting microphone permission...";
  voiceStatus.className="voiceStatus";

  try{

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Microphone not supported");
    }

    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      },
      video:false
    });

    voiceEnabled=true;

    voiceBtn.textContent="🎙️ VOICE ON";
    voiceBtn.classList.add("on");
    voiceStatus.textContent="Microphone ON — connecting...";
    voiceStatus.className="voiceStatus";

    createPeer();

    send({
      type:"voice-ready"
    });

  }catch(err){

    voiceEnabled=false;

    voiceStatus.textContent=
      err.name==="NotAllowedError"
      ? "Microphone permission denied"
      : "Microphone unavailable";

    voiceStatus.className="voiceStatus bad";

    voiceBtn.textContent="🎙️ VOICE OFF";
    voiceBtn.classList.remove("on");

  }finally{
    voiceBtn.disabled=false;
  }
}

voiceBtn.addEventListener("click",toggleVoice);

function createPeer(){

  if(peer)return;

  peer=new RTCPeerConnection(rtcConfig);

  remoteDescriptionSet=false;
  iceQueue=[];

  if(localStream){
    localStream.getTracks().forEach(track=>{
      peer.addTrack(track,localStream);
    });
  }

  peer.onicecandidate=e=>{
    if(e.candidate){
      send({
        type:"voice-ice",
        candidate:e.candidate
      });
    }
  };

  peer.ontrack=e=>{

    if(!remoteAudio){
      remoteAudio=document.createElement("audio");
      remoteAudio.autoplay=true;
      remoteAudio.playsInline=true;
      remoteAudio.style.display="none";
      document.body.appendChild(remoteAudio);
    }

    remoteAudio.srcObject=e.streams[0];

    const playPromise=remoteAudio.play();

    if(playPromise){
      playPromise.catch(()=>{});
    }
  };

  peer.onconnectionstatechange=()=>{

    const state=peer.connectionState;

    if(state==="connected"){
      voiceStatus.textContent="🎙️ VOICE CONNECTED";
      voiceStatus.className="voiceStatus good";
    }

    if(state==="connecting"){
      voiceStatus.textContent="Connecting voice...";
      voiceStatus.className="voiceStatus";
    }

    if(state==="failed"){
      voiceStatus.textContent="VOICE CONNECTION FAILED";
      voiceStatus.className="voiceStatus bad";
    }

    if(state==="disconnected"){
      voiceStatus.textContent="Voice temporarily disconnected";
      voiceStatus.className="voiceStatus bad";
    }
  };

  peer.oniceconnectionstatechange=()=>{

    if(peer.iceConnectionState==="failed"){
      voiceStatus.textContent="Voice network path failed";
      voiceStatus.className="voiceStatus bad";
    }
  };
}

async function makeOffer(){

  if(!voiceEnabled)return;

  createPeer();

  try{

    const offer=await peer.createOffer();

    await peer.setLocalDescription(offer);

    send({
      type:"voice-offer",
      offer:offer
    });

  }catch(err){

    voiceStatus.textContent="Could not start voice";
    voiceStatus.className="voiceStatus bad";
  }
}

async function handleOffer(offer){

  if(!voiceEnabled)return;

  createPeer();

  try{

    await peer.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    remoteDescriptionSet=true;

    await flushIce();

    const answer=await peer.createAnswer();

    await peer.setLocalDescription(answer);

    send({
      type:"voice-answer",
      answer:answer
    });

  }catch(err){

    voiceStatus.textContent="Voice offer failed";
    voiceStatus.className="voiceStatus bad";
  }
}

async function handleAnswer(answer){

  if(!peer)return;

  try{

    await peer.setRemoteDescription(
      new RTCSessionDescription(answer)
    );

    remoteDescriptionSet=true;

    await flushIce();

  }catch(err){

    voiceStatus.textContent="Voice answer failed";
    voiceStatus.className="voiceStatus bad";
  }
}

async function handleIce(candidate){

  if(!candidate)return;

  if(!peer){
    iceQueue.push(candidate);
    return;
  }

  if(!remoteDescriptionSet){
    iceQueue.push(candidate);
    return;
  }

  try{
    await peer.addIceCandidate(
      new RTCIceCandidate(candidate)
    );
  }catch(err){}
}

async function flushIce(){

  if(!peer)return;

  while(iceQueue.length){

    const candidate=iceQueue.shift();

    try{
      await peer.addIceCandidate(
        new RTCIceCandidate(candidate)
      );
    }catch(err){}
  }
}

function closePeerOnly(){

  if(peer){
    try{peer.close()}catch(e){}
  }

  peer=null;
  remoteDescriptionSet=false;
  iceQueue=[];

  if(remoteAudio){
    remoteAudio.srcObject=null;
    remoteAudio.remove();
    remoteAudio=null;
  }
}

function stopVoice(){

  voiceEnabled=false;

  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream=null;
  }

  closePeerOnly();

  voiceBtn.textContent="🎙️ VOICE OFF";
  voiceBtn.classList.remove("on");
  voiceStatus.textContent="Voice ready when both players join";
  voiceStatus.className="voiceStatus";
}

</script>
</body>
</html>
