<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#170f2e;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
#app{width:100%;max-width:520px;text-align:center}
h1{font-size:38px;margin:5px 0 15px;font-weight:900}
p{color:#bbb;margin:6px 0 14px}
input,button{font:inherit;border:0;border-radius:12px;padding:14px}
input{width:100%;margin-bottom:10px;background:#fff;color:#111}
button{cursor:pointer;font-weight:800}
button:disabled{opacity:.55;cursor:wait}
.primary{background:#2fd8ff;color:#07121a;width:100%}
.secondary{background:#30234f;color:#fff'}
.hidden{display:none!important}
.room,.result{background:#21163d;border-radius:18px;padding:20px;margin-top:15px}
.roomCode{font-size:32px;font-weight:900;letter-spacing:5px;margin:12px 0}
.copy{background:#ffa81f;color:#17100a;width:100%}
.scores{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.score{flex:1;padding:12px;border-radius:14px;background:#21163d;font-weight:900;overflow-wrap:anywhere}
.cyan{color:#2fd8ff}.orange{color:#ffa81f}
canvas{display:block;width:min(92vw,440px);height:min(92vw,440px);max-width:440px;max-height:440px;margin:10px auto;background:#0d091b;border:3px solid #4a3b70;border-radius:12px}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:270px;margin:14px auto}
.controls button{height:58px;padding:6px 2px;font-size:25px;background:#fff;color:#170f2e;touch-action:none;user-select:none;-webkit-user-select:none}
.controls button:active{transform:scale(.95);background:#2fd8ff}
.controls .up{grid-column:2;grid-row:1}
.controls .left{grid-column:1;grid-row:2}
.controls .down{grid-column:2;grid-row:2}
.controls .right{grid-column:3;grid-row:2}
.status{min-height:25px;font-weight:800;margin:8px}
.countdown{font-size:64px;font-weight:900;margin:10px}
.small{font-size:13px;color:#999}
#roomInput{text-transform:uppercase}
.result h2{font-size:28px;margin:5px 0 15px;overflow-wrap:anywhere}
.gameTop{display:flex;justify-content:flex-end;margin-bottom:10px}
.exitBtn{background:#30234f;color:#fff;padding:10px 16px}
.result{border:1px solid #4a3b70}
#menuStatus{min-height:22px;margin-top:12px;color:#ffbd57;font-size:13px}
@media(max-width:360px){
  h1{font-size:32px}
  .controls{gap:6px;max-width:250px}
  .controls button{height:52px;font-size:22px}
}

/* Celebration overlay styles */
#celebration{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;pointer-events:none}
#celebration .inner{width:100%;max-width:820px;padding:24px;text-align:center}
.victory{font-weight:900;font-size:48px;letter-spacing:2px;margin-bottom:6px;color:#fff;text-transform:uppercase}
.victory.neon-cyan{color:#2fd8ff;text-shadow:0 0 8px rgba(47,216,255,.85),0 0 18px rgba(47,216,255,.55),0 0 36px rgba(47,216,255,.3)}
.victory.neon-orange{color:#ffa81f;text-shadow:0 0 8px rgba(255,168,31,.85),0 0 18px rgba(255,168,31,.55),0 0 36px rgba(255,168,31,.3)}
.victor-name{font-weight:900;font-size:36px;margin:6px 0;display:inline-block}
.victor-name .letter{display:inline-block;opacity:0;transform:translateY(8px) rotate(-6deg);font-size:1em;margin:0 1px}
.victor-name .neon-cyan{color:#2fd8ff;text-shadow:0 0 6px rgba(47,216,255,.9),0 0 14px rgba(47,216,255,.6),0 0 28px rgba(47,216,255,.25)}
.victor-name .neon-orange{color:#ffa81f;text-shadow:0 0 6px rgba(255,168,31,.9),0 0 14px rgba(255,168,31,.6),0 0 28px rgba(255,168,31,.25)}
@keyframes letterIn{0%{opacity:0;transform:translateY(8px) rotate(-6deg);filter:blur(2px)}50%{opacity:1;transform:translateY(-4px) rotate(2deg)}100%{opacity:1;transform:translateY(0) rotate(0);filter:blur(0)}}

/* emoji burst */
.emoji-burst{font-size:34px;margin-top:10px;display:flex;gap:10px;justify-content:center;align-items:center}
.emoji-burst .emoji{opacity:0;transform:scale(.6) translateY(6px);display:inline-block}
@keyframes emojiPop{0%{opacity:0;transform:scale(.6) translateY(8px)}60%{opacity:1;transform:scale(1.18) translateY(-6px)}100%{transform:scale(1) translateY(0);opacity:1}}

/* champion text */
.champion{font-size:20px;margin-top:10px;font-weight:900;opacity:0;transform:translateY(6px)}
@keyframes championIn{0%{opacity:0;transform:translateY(8px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:39;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:14px;opacity:0.95;border-radius:2px;transform-origin:center;will-change:transform,opacity}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(520deg);opacity:1}}

/* Ensure result buttons stay clickable */
#result{position:relative;z-index:45}
#celebration, #confetti{display:none}
#celebration.show{display:flex}
#confetti.show{display:block}

@media(max-width:480px){
  .victory{font-size:34px}
  .victor-name{font-size:28px}
  .emoji-burst{font-size:28px}
}
</style>
</head>
<body>
<div id="app">
<h1>⚡ LIGHT DUEL</h1>

<div id="menu">
<p>Real-time multiplayer light battle</p>
<input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="nickname">
<input id="roomInput" maxlength="4" placeholder="Room code (join)">
<button class="primary" id="createBtn">CREATE ROOM</button>
<br><br>
<button class="secondary" id="joinBtn">JOIN ROOM</button>
<div class="small">Create a room or enter a 4-character code to join.</div>
<div id="menuStatus" role="status"></div>
</div>

<div id="roomScreen" class="room hidden">
<div>Your Room</div>
<div class="roomCode" id="roomCode">----</div>
<button class="copy" id="copyBtn">📋 COPY CODE</button>
<p id="roomStatus">Waiting for another player...</p>
</div>

<div id="game" class="hidden">
<div class="gameTop">
<button class="exitBtn" id="exitBtn">✕ EXIT</button>
</div>

<div class="scores">
<div class="score cyan"><span id="p1Name">CYAN</span><br><span id="p1Score">0</span></div>
<div class="score orange"><span id="p2Name">ORANGE</span><br><span id="p2Score">0</span></div>
</div>

<div id="speed" class="small">SPEED: 1.00x</div>
<canvas id="board" width="44" height="44"></canvas>

<div class="controls" id="controls">
<button class="up" data-dir="U" aria-label="Up">⬆️</button>
<button class="left" data-dir="L" aria-label="Left">⬅️</button>
<button class="down" data-dir="D" aria-label="Down">⬇️</button>
<button class="right" data-dir="R" aria-label="Right">➡️</button>
</div>

<div id="status" class="status" role="status"></div>
<div id="countdown" class="countdown hidden></div>

<div id="result" class="result hidden">
<h2 id="resultText"></h2>
<button class="primary" id="againBtn">PLAY AGAIN</button>
<p class="small" id="againStatus">Both players must stay connected.</p>
</div>
</div>
</div>

<!-- Celebration overlay (only shown on match win) -->
<div id="celebration" aria-hidden="true">
  <div class="inner">
    <div id="victoryText" class="victory">VICTORY! 🏆</div>
    <div id="victorName" class="victor-name" aria-live="polite"></div>
    <div id="emojiBurst" class="emoji-burst hidden">
      <span class="emoji">🥂🍾</span>
      <span class="emoji">🎉</span>
      <span class="emoji">🎊</span>
      <span class="emoji">✨</span>
    </div>
    <div id="championText" class="champion hidden">CHAMPION! 🏆🥂</div>
  </div>
</div>
<div id="confetti"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("board");
const ctx = canvas.getContext("2d");
const SIZE = 44;

const menu = $("menu");
const menuStatus = $("menuStatus");
const roomScreen = $("roomScreen");
const game = $("game");
const nameInput = $("nameInput");
const roomInput = $("roomInput");
const createBtn = $("createBtn");
const joinBtn = $("joinBtn");
const copyBtn = $("copyBtn");
const exitBtn = $("exitBtn");
const roomCodeEl = $("roomCode");
const roomStatus = $("roomStatus");
const statusEl = $("status");
const p1Name = $("p1Name");
const p2Name = $("p2Name");
const p1Score = $("p1Score");
const p2Score = $("p2Score");
const speedEl = $("speed");
const countdown = $("countdown");
const result = $("result");
const resultText = $("resultText");
const againBtn = $("againBtn");
const againStatus = $("againStatus");

// Celebration elements
const celebration = $("celebration");
const victoryText = $("victoryText");
const victorName = $("victorName");
const emojiBurst = $("emojiBurst");
const championText = $("championText");
const confettiRoot = $("confetti");

let ws = null;
let connectPromise = null;
let player = null;
let room = "";
let myName = "";
let players = [null, null];
let scores = [0, 0];
let playerNames = ["CYAN", "ORANGE"];
let gameRunning = false;
let roomConnected = false;
let exiting = false;

function setStatus(message) {
  statusEl.textContent = message;
  menuStatus.textContent = menu.classList.contains("hidden") ? "" : message;
}

function serverURL() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  return protocol + "//" + location.host;
}

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    return Promise.resolve(ws);
  }

  if (ws && ws.readyState === WebSocket.CONNECTING && connectPromise) {
    return connectPromise;
  }

  setStatus("Connecting to server...");
  exiting = false;

  const socket = new WebSocket(serverURL());
  ws = socket;

  connectPromise = new Promise((resolve, reject) => {
    let opened = false;

    socket.onopen = () => {
      opened = true;
      setStatus("Connected to server.");
      resolve(socket);
    };

    socket.onmessage = event => {
      let message;
      try {
        message = JSON.parse(event.data);
      } catch {
        return;
      }
      handle(message);
    };

    socket.onerror = () => {
      setStatus("Connection error. Check your internet and try again.");
      if (!opened) reject(new Error("WebSocket connection failed"));
    };

    socket.onclose = () => {
      if (ws === socket) ws = null;
      connectPromise = null;
      roomConnected = false;
      gameRunning = false;

      if (!opened) {
        reject(new Error("Connection closed before opening"));
      }

      if (!exiting) {
        setStatus("Disconnected. Check your connection and try again.");
      }
    };
  });

  return connectPromise;
}

function send(message) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(message));
    return true;
  }
  return false;
}

async function createRoom() {
  lockMenuButtons(true);
  myName = (nameInput.value.trim() || "Player").slice(0, 16);

  try {
    await connect();
    if (!send({type:"create", name:myName})) {
      throw new Error("Connection lost");
    }
  } catch {
    setStatus("Could not connect. Try again in a moment.");
  } finally {
    lockMenuButtons(false);
  }
}

async function joinRoom() {
  room = roomInput.value.trim().toUpperCase();

  if (room.length !== 4) {
    alert("Enter a 4-character room code.");
    return;
  }

  lockMenuButtons(true);
  myName = (nameInput.value.trim() || "Player").slice(0, 16);

  try {
    await connect();
    if (!send({type:"join", code:room, name:myName})) {
      throw new Error("Connection lost");
    }
  } catch {
    setStatus("Could not connect. Try again in a moment.");
  } finally {
    lockMenuButtons(false);
  }
}

function lockMenuButtons(locked) {
  createBtn.disabled = locked;
  joinBtn.disabled = locked;
}

function handle(m) {
  if (m.type === "error") {
    const message = m.message || "Something went wrong.";
    setStatus(message);
    alert(message);
    return;
  }

  if (m.type === "room") {
    room = m.code;
    player = m.player;
    playerNames = m.playerNames || playerNames;
    roomCodeEl.textContent = room;
    menu.classList.add("hidden");
    roomScreen.classList.remove("hidden");
    roomStatus.textContent = player === 0
      ? "Waiting for another player..."
      : "Joined room. Connecting...";
    updateNames();
    return;
  }

  if (m.type === "waiting") {
    roomStatus.textContent = "Waiting for another player...";
    return;
  }

  if (m.type === "connected") {
    roomConnected = true;
    playerNames = m.playerNames || playerNames;
    updateNames();

    if (player !== null) {
      roomStatus.textContent = "Both players connected! Get ready...";
      showGame();
    }
    return;
  }

  if (m.type === "round") {
    players = m.players || [null, null];
    scores = m.scores || scores;
    playerNames = m.playerNames || playerNames;
    gameRunning = false;
    result.classList.add("hidden");
    againBtn.disabled = false;
    againBtn.textContent = "PLAY AGAIN";
    showGame();
    updateNames();
    drawGame();
    showCountdown(m.count || 3);
    setStatus("Get ready!");
    // Hide celebration at the start of a new round
    hideCelebration();
    return;
  }

  if (m.type === "count") {
    showCountdown(m.count);
    return;
  }

  if (m.type === "go") {
    countdown.textContent = "GO!";
    countdown.classList.remove("hidden");
    gameRunning = true;

    setTimeout(() => {
      if (gameRunning) countdown.classList.add("hidden");
    }, 600);

    setStatus("Ride the light. Avoid the trails!");
    return;
  }

  if (m.type === "state") {
    players = m.players || players;
    scores = m.scores || scores;
    playerNames = m.playerNames || playerNames;
    updateNames();
    drawGame();
    return;
  }

  if (m.type === "result") {
    players = m.players || players;
    scores = m.scores || scores;
    playerNames = m.playerNames || playerNames;
    gameRunning = false;
    updateNames();
    drawGame();
    countdown.classList.add("hidden");
    result.classList.remove("hidden");
    againBtn.disabled = false;

    if (m.headOn || m.winner === null || m.winner === undefined) {
      resultText.textContent = "DRAW! ⚡";
    } else {
      const winnerName = playerNames[m.winner] ||
        (m.winner === 0 ? "CYAN" : "ORANGE");
      resultText.textContent = "🏆 " + winnerName.toUpperCase() + " WINS! 🎉";
    }

    if (m.matchOver) {
      resultText.textContent += " 🥇";
      againStatus.textContent = "Match complete! Play Again starts a new match.";
      againBtn.textContent = "NEW MATCH";
      setStatus("Match complete!");
      // Trigger celebration for match win
      if (m.winner === 0 || m.winner === 1) {
        const winnerName = (playerNames[m.winner] || (m.winner === 0 ? "CYAN" : "ORANGE")).toUpperCase();
        showCelebration(m.winner, winnerName);
      }
    } else {
      againStatus.textContent = "Round finished. Play Again to continue.";
      againBtn.textContent = "PLAY AGAIN";
      setStatus("Round finished!");
    }
    return;
  }

  if (m.type === "opponent_left") {
    gameRunning = false;
    roomConnected = false;
    result.classList.remove("hidden");
    resultText.textContent = "OPPONENT LEFT";
    againBtn.disabled = true;
    againStatus.textContent = "Exit and create a new room to play again.";
    setStatus("Your opponent disconnected.");
    hideCelebration();
  }
}

function showGame() {
  roomScreen.classList.add("hidden");
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  updateNames();
}

function updateNames() {
  p1Name.textContent = (playerNames[0] || "CYAN").toUpperCase();
  p2Name.textContent = (playerNames[1] || "ORANGE").toUpperCase();
  p1Score.textContent = scores[0] || 0;
  p2Score.textContent = scores[1] || 0;
}

function showCountdown(number) {
  countdown.classList.remove("hidden");
  countdown.textContent = number;
  if (number > 0) gameRunning = false;
}

function drawGame() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = "#0d091b";
  ctx.fillRect(0, 0, SIZE, SIZE);

  ctx.strokeStyle = "rgba(255,255,255,.06)";
  ctx.lineWidth = 0.08;

  for (let i = 0; i <= SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, SIZE);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(SIZE, i);
    ctx.stroke();
  }

  players.forEach((p, index) => {
    if (!p) return;
    const color = index === 0 ? "#2fd8ff" : "#ffa81f";

    ctx.fillStyle = color;

    if (Array.isArray(p.trail)) {
      p.trail.forEach(cell => {
        if (Array.isArray(cell) && cell.length >= 2) {
          ctx.fillRect(cell[0], cell[1], 1, 1);
        }
      });
    }

    ctx.fillStyle = "#fff";
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.fillRect(p.x, p.y, 1, 1);
    ctx.shadowBlur = 0;
  });

  const trailLength = players.reduce((max, p) => {
    return Math.max(max, p && p.trail ? p.trail.length : 1);
  }, 1);

  const speed = Math.min(1.5, 1 + Math.floor(trailLength / 60) * 0.05);
  speedEl.textContent = "SPEED: " + speed.toFixed(2) + "x";
}

function queueTurn(direction) {
  if (!gameRunning || !ws || ws.readyState !== WebSocket.OPEN) return;
  send({type:"turn", dir:direction});
}

/* Pointer events support touch and mouse without duplicate moves. */
document.querySelectorAll(".controls button").forEach(button => {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    queueTurn(button.dataset.dir);
  });
});

document.addEventListener("keydown", event => {
  if (game.classList.contains("hidden") || !gameRunning) return;

  const key = event.key.toLowerCase();
  const keys = ["arrowup","arrowdown","arrowleft","arrowright"," "];

  if (keys.includes(key)) event.preventDefault();

  if (key === "w" || key === "arrowup") queueTurn("U");
  if (key === "s" || key === "arrowdown") queueTurn("D");
  if (key === "a" || key === "arrowleft") queueTurn("L");
  if (key === "d" || key === "arrowright") queueTurn("R");
});

copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(room);
    copyBtn.textContent = "✅ COPIED!";
    setTimeout(() => copyBtn.textContent = "📋 COPY CODE", 1500);
  } catch {
    prompt("Copy this room code:", room);
  }
});

createBtn.addEventListener("click", createRoom);
joinBtn.addEventListener("click", joinRoom);

roomInput.addEventListener("input", () => {
  roomInput.value = roomInput.value.toUpperCase()
    .replace(/[^A-Z0-9]/g, "").slice(0, 4);
});

againBtn.addEventListener("click", () => {
  if (!send({type:"next"})) {
    setStatus("Not connected to the server.");
    return;
  }
  againBtn.disabled = true;
  againStatus.textContent = "Waiting for the other player...";
});

exitBtn.addEventListener("click", () => {
  if (!confirm("Are you sure you want to leave this match?")) return;

  exiting = true;
  gameRunning = false;

  if (ws) {
    const socket = ws;
    ws = null;
    connectPromise = null;
    socket.close();
  }

  roomConnected = false;
  player = null;
  room = "";
  players = [null, null];
  scores = [0, 0];
  playerNames = ["CYAN", "ORANGE"];

  game.classList.add("hidden");
  roomScreen.classList.add("hidden");
  menu.classList.remove("hidden");
  result.classList.add("hidden");
  countdown.classList.add("hidden");

  roomInput.value = "";
  statusEl.textContent = "";
  menuStatus.textContent = "";
  roomStatus.textContent = "Waiting for another player...";
  updateNames();
  hideCelebration();
});

// Celebration logic
function clearChildren(el){ while(el.firstChild) el.removeChild(el.firstChild); }

function hideCelebration(){
  celebration.classList.remove('show');
  celebration.setAttribute('aria-hidden','true');
  victoryText.classList.remove('neon-cyan','neon-orange');
  victorName.textContent = '';
  emojiBurst.classList.add('hidden');
  championText.classList.add('hidden');
  confettiRoot.classList.remove('show');
  // remove confetti pieces
  clearChildren(confettiRoot);
}

function createConfettiPieces(count, colorSet){
  const pieces = [];
  const w = window.innerWidth;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const left = Math.random()*100; // vw percentage
    el.style.left = left + 'vw';
    el.style.top = (-Math.random()*20) + 'vh';
    el.style.background = colorSet[Math.floor(Math.random()*colorSet.length)];
    const delay = Math.random()*0.6;
    const duration = 2 + Math.random()*2.5;
    el.style.animation = `confettiFall ${duration}s linear ${delay}s forwards`;
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    confettiRoot.appendChild(el);
    pieces.push(el);
  }
  return pieces;
}

async function showCelebration(winnerIndex, winnerName){
  hideCelebration();
  // choose color class
  const isCyan = winnerIndex === 0;
  victoryText.classList.add(isCyan? 'neon-cyan':'neon-orange');
  celebration.classList.add('show');
  celebration.setAttribute('aria-hidden','false');

  // prepare name container and animate letters
  clearChildren(victorName);
  const name = winnerName || (isCyan? 'CYAN':'ORANGE');
  // set responsive font size slightly larger on long names
  // create spans per letter
  const letters = Array.from(name);
  letters.forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'letter ' + (isCyan? 'neon-cyan':'neon-orange');
    span.textContent = ch;
    // schedule animation via setTimeout
    setTimeout(()=>{
      span.style.animation = 'letterIn 420ms cubic-bezier(.2,.9,.3,1) forwards';
      // add subtle trail using text shadow transition (kept by CSS)
    }, i * 200); // ~0.2s per letter
    victorName.appendChild(span);
  });

  // show confetti and emojis after name animation completes
  const totalNameTime = letters.length * 200 + 500;

  setTimeout(()=>{
    // show emoji burst with staggered pop
    emojiBurst.classList.remove('hidden');
    Array.from(emojiBurst.children).forEach((el,i)=>{
      el.style.animation = `emojiPop 650ms cubic-bezier(.2,.8,.2,1) ${i*120}ms both`;
    });

    // champion text
    championText.classList.remove('hidden');
    championText.style.animation = 'championIn 560ms cubic-bezier(.2,.9,.2,1) 300ms both';

    // add confetti
    confettiRoot.classList.add('show');
    const colors = isCyan ? ['#2fd8ff','#9eeeff','#4ac6ff','#fff'] : ['#ffa81f','#ffd58b','#ffc36b','#fff'];
    createConfettiPieces(28, colors);

    // subtle pulse on victory title
    victoryText.animate([
      {transform: 'scale(1)', filter:'brightness(1)'},
      {transform: 'scale(1.04)', filter:'brightness(1.12)'},
      {transform: 'scale(1)', filter:'brightness(1)'}
    ], {duration: 1400, iterations: 2});

    // auto-hide celebration after some time (but keep result visible)
    setTimeout(()=>{
      // fade confetti pieces out
      // keep overlay visible for a bit then allow it to be hidden by next round or exit
      // leave celebration shown for user until next round
    }, 3500);

  }, totalNameTime);
}

// Utility to ensure celebration is hidden initially
hideCelebration();

// End celebration logic

// rest of game code continues...

function queueTurn(direction) {
  if (!gameRunning || !ws || ws.readyState !== WebSocket.OPEN) return;
  send({type:"turn", dir:direction});
}

// draw initial board
drawGame();
</script>
