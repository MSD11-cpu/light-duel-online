<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel — Online</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800&display=swap');

:root{
  --bg:#090612;
  --panel:#120b21;
  --violet:#170f2e;
  --cyan:#2fd8ff;
  --orange:#ffa81f;
  --muted:#9d96b3
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Outfit,system-ui,sans-serif
}

.app{
  width:min(100%,720px);
  margin:auto;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))
}

h1,.big{
  font-family:Bungee,Impact,sans-serif
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.brand{
  font-family:Bungee;
  font-size:25px
}

.status{
  font-size:12px;
  color:var(--muted)
}

.scores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px
}

.score{
  padding:8px 12px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid #312746;
  display:flex;
  justify-content:space-between;
  align-items:center
}
