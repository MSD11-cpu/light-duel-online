<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel — Online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800&display=swap');
:root{--bg:#090612;--panel:#120b21;--violet:#170f2e;--cyan:#2fd8ff;--orange:#ffa81f;--muted:#9d96b3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}
.app{width:min(100%,720px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}
h1,.big{font-family:Bungee,Impact,sans-serif}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-family:Bungee;font-size:25px}.status{font-size:12px;color:var(--muted)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.score{padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid #312746;display:flex;justify-content:space-between;align-items:center}.score.c{border-color:#2fd8ff66}.score.o{border-color:#ffa81f66}.c{color:var(--cyan)}.o{color:var(--orange)}.score b{font-family:Bungee;font-size:24px}
.board{position:relative;aspect-ratio:1;background:var(--violet);border-radius:14px;overflow:hidden;border:1px solid #32264d}.board canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0d081dcc;padding:20px}.hidden{display:none}.panel{width:min(92%,420px)}.panel h2{font-family:Bungee;font-size:32px;margin:0 0 10px}.panel p{color:#bdb6cf;margin:0 0 16px}.btn{min-height:52px;border:0;border-radius:12px;padding:0 20px;font:800 16px Outfit;cursor:pointer}.primary{background:#fff;color:#170f2e}.input{width:100%;height:52px;border-radius:12px;border:1px solid #46395e;background:#181027;color:#fff;padding:0 15px;font:600 17px Outfit;text-align:center;letter-spacing:4px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.turn{height:72px;border-radius:14px;background:#171025;border:1px solid #40345a;font-size:36px;font-weight:900;touch-action:manipulation;color:#fff}.turn.c{color:var(--cyan);border-color:#2fd8ff77}.turn.o{color:var(--orange);border-color:#ffa81f77}.turn:active{transform:scale(.97)}.hint{display:flex;justify-content:space-between;font-size:11px;color:#827a98;margin-top:7px;padding:0 3px}.hiddenControls{display:none}
@media(max-width:390px){.app{padding-left:8px;padding-right:8px}.turn{height:72px}.brand{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <div class="head"><div class="brand">LIGHT DUEL</div><div class="status" id="status">ONLINE</div></div>
  <div class="scores"><div class="score"><span class="c">CYAN · P1</span><b class="c" id="s0">0</b></div><div class="score"><span class="o">ORANGE · P2</span><b class="o" id="s1">0</b></div></div>
  <div class="board"><canvas id="game" width="880" height="880"></canvas>
    <div class="overlay" id="overlay"><div class="panel">
      <h2 id="title">LIGHT DUEL</h2><p id="desc">Create a room or join a friend's room.</p>
      <div id="home"><div class="row"><button class="btn primary" id="create">CREATE ROOM</button><button class="btn primary" id="showJoin">JOIN ROOM</button></div></div>
      <div id="joinBox" style="display:none"><input class="input" id="roomInput" maxlength="4" placeholder="ROOM CODE"><div class="row"><button class="btn" id="back">BACK</button><button class="btn primary" id="join">JOIN</button></div></div>
      <div id="roomBox" style="display:none"><p>Your room code</p><div class="big" id="roomCode" style="font-size:46px;letter-spacing:5px"></div><p id="wait">Waiting for Player 2…</p></div>
      <div id="resultBox" style="display:none"><button class="btn primary" id="next">NEXT ROUND</button></div>
    </div></div>
  </div>
  <div class="controls" id="controls"><div class="pair"><button class="turn c" data-p="0" data-d="L" aria-label="Cyan turn left">↰</button><button class="turn c" data-p="0" data-d="R" aria-label="Cyan turn right">↱</button></div><div class="pair"><button class="turn o" data-p="1" data-d="L" aria-label="Orange turn left">↰</button><button class="turn o" data-p="1" data-d="R" aria-label="Orange turn right">↱</button></div></div>
  <div class="hint"><span>CYAN: A / D</span><span>ORANGE: ← / →</span></div>
</main>
<script>
const N=44,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const title=document.getElementById('title'),desc=document.getElementById('desc'),status=document.getElementById('status'),home=document.getElementById('home'),joinBox=document.getElementById('joinBox'),roomBox=document.getElementById('roomBox'),resultBox=document.getElementById('resultBox');
const roomInput=document.getElementById('roomInput'),roomCode=document.getElementById('roomCode'),s0=document.getElementById('s0'),s1=document.getElementById('s1');
let ws=null,myPlayer=null,statePlayers=[],phase='home',pendingMessage=null;

function wsUrl(){return (location.protocol==='https:'?'wss://':'ws://')+location.host}
function send(x){if(ws&&ws.readyState===1){ws.send(JSON.stringify(x));return true}pendingMessage=x;return false}
function connect(message){if(ws&& (ws.readyState===0||ws.readyState===1)){if(message) pendingMessage=message; return;} ws=new WebSocket(wsUrl()); ws.onopen=()=>{status.textContent='CONNECTED';if(pendingMessage){const m=pendingMessage;pendingMessage=null;send(m)}};ws.onclose=()=>{status.textContent='OFFLINE';if(phase==='play'){show('CONNECTION LOST','Reload the page to reconnect.')}};ws.onerror=()=>status.textContent='CONNECTION ERROR';ws.onmessage=e=>handle(JSON.parse(e.data))}
function show(t,d){title.textContent=t;desc.textContent=d;home.style.display='none';joinBox.style.display='none';roomBox.style.display='none';resultBox.style.display='none';overlay.classList.remove('hidden')}
function handle(m){
 if(m.type==='room'){myPlayer=m.player;roomCode.textContent=m.code;show('ROOM '+m.code,'Share this code with Player 2.');roomBox.style.display='block'}
 if(m.type==='waiting'){show('WAITING','Player 2 can join with your room code.');roomBox.style.display='block'}
 if(m.type==='connected'){show('OPPONENT CONNECTED','Get ready…');setTimeout(()=>overlay.classList.add('hidden'),900)}
 if(m.type==='round'){statePlayers=m.players;setScore(m.scores);show(String(m.count),'GET READY');setTimeout(()=>{},1)}
 if(m.type==='count'){title.textContent=m.count;desc.textContent='GET READY';}
 if(m.type==='go'){phase='play';overlay.classList.add('hidden')}
 if(m.type==='state'){statePlayers=m.players;setScore(m.scores)}
 if(m.type==='result'){statePlayers=m.players;setScore(m.scores);phase='result';const head=m.headOn;const won=m.winner===myPlayer;show(head?'DOUBLE CRASH':(won?'ROUND WIN':'ROUND LOST'),head?'Nobody scores this round.':('Score '+m.scores[0]+' – '+m.scores[1]));resultBox.style.display=m.matchOver?'none':'block';if(m.matchOver){title.textContent=won?'MATCH WON':'MATCH LOST';desc.textContent='First to 5 rounds.';resultBox.style.display='block';document.getElementById('next').textContent='PLAY AGAIN'}}
 if(m.type==='opponent_left')show('OPPONENT LEFT','The room has ended. Reload to create a new room.')
 if(m.type==='error')show('ERROR',m.message)
}
function setScore(s){s0.textContent=s[0];s1.textContent=s[1]}
function draw(){ctx.fillStyle='#170f2e';ctx.fillRect(0,0,880,880);ctx.strokeStyle='rgba(255,255,255,.045)';for(let i=1;i<N;i++){let x=i*20+.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,880);ctx.stroke();let y=i*20+.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(880,y);ctx.stroke()}statePlayers.forEach((p,i)=>{if(!p)return;let col=i?'#ffa81f':'#2fd8ff';ctx.save();ctx.shadowColor=col;ctx.shadowBlur=13;ctx.fillStyle=col;p.trail.forEach(([x,y],k)=>{ctx.globalAlpha=.2+.8*k/p.trail.length;ctx.fillRect(x*20+4,y*20+4,12,12)});ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.fillRect(p.x*20+3,p.y*20+3,14,14);ctx.restore()})}
function loop(){draw();requestAnimationFrame(loop)}
document.getElementById('create').onclick=()=>{status.textContent='CONNECTING…';connect({type:'create'});};
document.getElementById('showJoin').onclick=()=>{home.style.display='none';joinBox.style.display='block';title.textContent='JOIN ROOM';desc.textContent='Enter your friend's 4-character code.'};
document.getElementById('back').onclick=()=>{joinBox.style.display='none';home.style.display='block';title.textContent='LIGHT DUEL';desc.textContent='Create a room or join a friend's room.'};
document.getElementById('join').onclick=()=>{const c=roomInput.value.trim().toUpperCase();if(c.length!==4){desc.textContent='Enter the 4-character room code.';return;}status.textContent='CONNECTING…';connect({type:'join',code:c});};
document.getElementById('next').onclick=()=>{send({type:'next'});phase='play';overlay.classList.add('hidden')};
document.querySelectorAll('.turn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(Number(b.dataset.p)===myPlayer)send({type:'turn',dir:b.dataset.d})}));
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='a'&&myPlayer===0)send({type:'turn',dir:'L'});if(e.key.toLowerCase()==='d'&&myPlayer===0)send({type:'turn',dir:'R'});if(e.key==='ArrowLeft'&&myPlayer===1)send({type:'turn',dir:'L'});if(e.key==='ArrowRight'&&myPlayer===1)send({type:'turn',dir:'R'})});
draw();loop();
</script>
</body>
</html>
