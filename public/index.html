<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#170f2e;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
#app{width:100%;max-width:520px;text-align:center}
h1{font-size:38px;margin:5px 0 15px;font-weight:900}
p{color:#bbb;margin:6px 0 14px}
input,button{font:inherit;border:0;border-radius:12px;padding:14px}
input{width:100%;margin-bottom:10px;background:#fff;color:#111}
button{cursor:pointer;font-weight:800}
button:disabled{opacity:.55;cursor:wait}
.primary{background:#2fd8ff;color:#07121a;width:100%}
.secondary{background:#30234f;color:#fff}
.hidden{display:none!important}
.room,.result{background:#21163d;border-radius:18px;padding:20px;margin-top:15px}
.roomCode{font-size:32px;font-weight:900;letter-spacing:5px;margin:12px 0}
.copy{background:#ffa81f;color:#17100a;width:100%}
.scores{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.score{flex:1;padding:12px;border-radius:14px;background:#21163d;font-weight:900;overflow-wrap:anywhere}
.cyan{color:#2fd8ff}.orange{color:#ffa81f}
canvas{display:block;width:min(92vw,440px);height:min(92vw,440px);max-width:440px;max-height:440px;margin:10px auto;background:#0d091b;border:3px solid #4a3b70;border-radius:12px}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:340px;margin:14px auto}
.controls button{height:56px;padding:6px 2px;font-size:25px;background:#fff;color:#170f2e;touch-action:manipulation}
.controls button:active{transform:scale(.95)}
.controls .up,.controls .left,.controls .down,.controls .right{grid-column:auto;grid-row:auto}
.status{min-height:25px;font-weight:800;margin:8px}
.countdown{font-size:64px;font-weight:900;margin:10px}
.small{font-size:13px;color:#999}
#roomInput{text-transform:uppercase}
.result h2{font-size:28px;margin:5px 0 15px}
.gameTop{display:flex;justify-content:flex-end;margin-bottom:10px}
.exitBtn{background:#30234f;color:#fff;padding:10px 16px}
.result{border:1px solid #4a3b70}
.result h2{overflow-wrap:anywhere}
@media(max-width:360px){
  h1{font-size:32px}
  .controls{gap:6px}
  .controls button{height:52px;font-size:22px}
}
</style>
</head>
<body>
<div id="app">
<h1>⚡ LIGHT DUEL</h1>

<div id="menu">
<p>Real-time multiplayer light battle</p>
<input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="nickname">
<input id="roomInput" maxlength="4" placeholder="Room code (join)">
<button class="primary" id="createBtn">CREATE ROOM</button>
<br><br>
<button class="secondary" id="joinBtn">JOIN ROOM</button>
<div class="small">Create a room or enter a 4-character code to join.</div>
</div>

<div id="roomScreen" class="room hidden">
<div>Your Room</div>
<div class="roomCode" id="roomCode">----</div>
<button class="copy" id="copyBtn">📋 COPY CODE</button>
<p id="roomStatus">Waiting for another player...</p>
</div>

<div id="game" class="hidden">
<div class="gameTop">
<button class="exitBtn" id="exitBtn">✕ EXIT</button>
</div>

<div class="scores">
<div class="score cyan"><span id="p1Name">CYAN</span><br><span id="p1Score">0</span></div>
<div class="score orange"><span id="p2Name">ORANGE</span><br><span id="p2Score">0</span></div>
</div>

<div id="speed" class="small">SPEED: 1x</div>

<canvas id="board" width="44" height="44"></canvas>

<div class="controls" id="controls">
<button class="up" data-dir="U" aria-label="Up">⬆️</button>
<button class="left" data-dir="L" aria-label="Left">⬅️</button>
<button class="down" data-dir="D" aria-label="Down">⬇️</button>
<button class="right" data-dir="R" aria-label="Right">➡️</button>
</div>

<div id="status" class="status"></div>
<div id="countdown" class="countdown hidden"></div>

<div id="result" class="result hidden">
<h2 id="resultText"></h2>
<button class="primary" id="againBtn">PLAY AGAIN</button>
<p class="small" id="againStatus">Both players must stay connected.</p>
</div>
</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("board");
const ctx = canvas.getContext("2d");
const SIZE = 44;

const menu = $("menu");
const roomScreen = $("roomScreen");
const game = $("game");
const nameInput = $("nameInput");
const roomInput = $("roomInput");
const createBtn = $("createBtn");
const joinBtn = $("joinBtn");
const copyBtn = $("copyBtn");
const exitBtn = $("exitBtn");
const roomCodeEl = $("roomCode");
const roomStatus = $("roomStatus");
const statusEl = $("status");
const p1Name = $("p1Name");
const p2Name = $("p2Name");
const p1Score = $("p1Score");
const p2Score = $("p2Score");
const speedEl = $("speed");
const countdown = $("countdown");
const result = $("result");
const resultText = $("resultText");
const againBtn = $("againBtn");
const againStatus = $("againStatus");

let ws = null;
let player = null;
let room = "";
let myName = "";
let players = [null, null];
let scores = [0, 0];
let playerNames = ["CYAN", "ORANGE"];
let gameRunning = false;
let roomConnected = false;
let exiting = false;

function serverURL() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  return protocol + "//" + location.host;
}

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN ||
              ws.readyState === WebSocket.CONNECTING)) {
    return Promise.resolve(ws);
  }

  statusEl.textContent = "Connecting to server...";
  exiting = false;
  ws = new WebSocket(serverURL());

  return new Promise((resolve, reject) => {
    const socket = ws;

    socket.onopen = () => {
      statusEl.textContent = "Connected to server";
      resolve(socket);
    };

    socket.onmessage = event => {
      let message;
      try {
        message = JSON.parse(event.data);
      } catch {
        return;
      }
      handle(message);
    };

    socket.onerror = () => {
      statusEl.textContent = "Connection error. Refresh and try again.";
      reject(new Error("WebSocket connection failed"));
    };

    socket.onclose = () => {
      if (ws === socket) ws = null;
      roomConnected = false;
      gameRunning = false;

      if (!exiting) {
        statusEl.textContent = "Disconnected from server. Check your connection and try again.";
      }
    };
  });
}

function send(message) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(message));
    return true;
  }
  return false;
}

async function createRoom() {
  createBtn.disabled = true;
  joinBtn.disabled = true;
  myName = (nameInput.value.trim() || "Player").slice(0, 16);

  try {
    await connect();
    send({ type: "create", name: myName });
  } catch {
    statusEl.textContent = "Could not connect. Check your internet and try again.";
  } finally {
    createBtn.disabled = false;
    joinBtn.disabled = false;
  }
}

async function joinRoom() {
  room = roomInput.value.trim().toUpperCase();

  if (room.length !== 4) {
    alert("Enter a 4-character room code.");
    return;
  }

  createBtn.disabled = true;
  joinBtn.disabled = true;
  myName = (nameInput.value.trim() || "Player").slice(0, 16);

  try {
    await connect();
    send({ type: "join", code: room, name: myName });
  } catch {
    statusEl.textContent = "Could not connect. Check your internet and try again.";
  } finally {
    createBtn.disabled = false;
    joinBtn.disabled = false;
  }
}

function handle(m) {
  if (m.type === "error") {
    alert(m.message || "Something went wrong.");
    statusEl.textContent = m.message || "Something went wrong.";
    return;
  }

  if (m.type === "room") {
    room = m.code;
    player = m.player;
    playerNames = m.playerNames || playerNames;
    roomCodeEl.textContent = room;
    menu.classList.add("hidden");
    roomScreen.classList.remove("hidden");
    roomStatus.textContent = player === 0
      ? "Waiting for another player..."
      : "Joined room. Connecting...";
    updateNames();
    return;
  }

  if (m.type === "waiting") {
    roomStatus.textContent = "Waiting for another player...";
    return;
  }

  if (m.type === "connected") {
    roomConnected = true;
    playerNames = m.playerNames || playerNames;
    updateNames();

    if (player !== null) {
      roomStatus.textContent = "Both players connected! Get ready...";
      showGame();
    }
    return;
  }

  if (m.type === "round") {
    players = m.players || [null, null];
    scores = m.scores || scores;
    playerNames = m.playerNames || playerNames;
    gameRunning = false;
    result.classList.add("hidden");
    againBtn.disabled = false;
    showGame();
    updateNames();
    drawGame();
    showCountdown(m.count || 3);
    statusEl.textContent = "Get ready!";
    return;
  }

  if (m.type === "count") {
    showCountdown(m.count);
    return;
  }

  if (m.type === "go") {
    countdown.textContent = "GO!";
    countdown.classList.remove("hidden");
    gameRunning = true;
    setTimeout(() => {
      if (gameRunning) countdown.classList.add("hidden");
    }, 600);
    statusEl.textContent = "Ride the light. Avoid the trails!";
    return;
  }

  if (m.type === "state") {
    players = m.players || players;
    scores = m.scores || scores;
    playerNames = m.playerNames || playerNames;
    updateNames();
    drawGame();
    return;
  }

  if (m.type === "result") {
    players = m.players || players;
    scores = m.scores || scores;
    playerNames = m.playerNames || playerNames;
    gameRunning = false;
    updateNames();
    drawGame();
    countdown.classList.add("hidden");
    result.classList.remove("hidden");
    againBtn.disabled = false;
