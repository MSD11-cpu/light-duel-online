<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel — Online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800&display=swap');

:root{
  --bg:#090612;
  --panel:#120b21;
  --violet:#170f2e;
  --cyan:#2fd8ff;
  --orange:#ffa81f;
  --muted:#9d96b3
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Outfit,system-ui,sans-serif
}

.app{
  width:min(100%,720px);
  margin:auto;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))
}

h1,.big{
  font-family:Bungee,Impact,sans-serif
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.brand{
  font-family:Bungee;
  font-size:25px
}

.status{
  font-size:12px;
  color:var(--muted)
}

.scores{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px
}

.score{
  padding:8px 12px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid #312746;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.score.c{border-color:#2fd8ff66}
.score.o{border-color:#ffa81f66}

.c{color:var(--cyan)}
.o{color:var(--orange)}

.score b{
  font-family:Bungee;
  font-size:24px
}

.score .playerName{
  font-size:11px;
  font-weight:700;
  letter-spacing:.4px;
  max-width:96px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:block;
  margin-top:2px
}

.board{
  position:relative;
  aspect-ratio:1;
  background:var(--violet);
  border-radius:14px;
  overflow:hidden;
  border:1px solid #32264d
}

.board canvas{
  width:100%;
  height:100%;
  display:block
}

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#0d081dcc;
  padding:20px
}

.hidden{display:none}

.panel{
  width:min(92%,420px)
}

.panel h2{
  font-family:Bungee;
  font-size:32px;
  margin:0 0 10px
}

.panel p{
  color:#bdb6cf;
  margin:0 0 16px
}

.btn{
  min-height:52px;
  border:0;
  border-radius:12px;
  padding:0 20px;
  font:800 16px Outfit;
  cursor:pointer
}

.primary{
  background:#fff;
  color:#170f2e
}

.input{
  width:100%;
  height:52px;
  border-radius:12px;
  border:1px solid #46395e;
  background:#181027;
  color:#fff;
  padding:0 15px;
  font:600 17px Outfit;
  text-align:center;
  letter-spacing:2px;
  margin-bottom:8px
}

.input::placeholder{
  color:#9d96b3
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:10px;
  min-height:196px
}

/* ===== V2 FOUR-DIRECTION CONTROLS ===== */

.pair{
  display:grid;
  grid-template-columns:repeat(3,78px);
  grid-template-rows:78px 78px;
  gap:7px;
  justify-content:center;
  align-items:center
}

.turn{
  width:78px;
  height:78px;
  border-radius:14px;
  background:#171025;
  border:1px solid #40345a;
  font-size:32px;
  font-weight:900;
  touch-action:manipulation;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0
}

.turn.c{
  color:var(--cyan);
  border-color:#2fd8ff77
}

.turn.o{
  color:var(--orange);
  border-color:#ffa81f77
}

.turn:active{
  transform:scale(.94);
  background:#24183c
}

/* Up / Down / Left / Right positions */
.turn.up{
  grid-column:2;
  grid-row:1
}

.turn.left{
  grid-column:1;
  grid-row:2
}

.turn.down{
  grid-column:2;
  grid-row:2
}

.turn.right{
  grid-column:3;
  grid-row:2
}

/* ===== VOICE CHAT ===== */
.voiceBox{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:2px auto 0;
  min-height:50px;
}
.voiceBtn{
  min-height:48px;
  border-radius:12px;
  border:1px solid #40345a;
  background:#171025;
  color:#fff;
  padding:0 18px;
  font:800 14px Outfit;
  cursor:pointer;
  touch-action:manipulation;
}
.voiceBtn.on{
  border-color:#66e0a3;
  background:#14271f;
}
.voiceBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.voiceStatus{
  color:#827a98;
  font-size:11px;
  font-weight:700;
  letter-spacing:.3px;
}
.voiceStatus.on{color:#66e0a3}
.voiceStatus.error{color:#ff8a8a}

.hint{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#827a98;
  margin-top:7px;
  padding:0 3px
}

.nameError{
  color:#ff8a8a;
  font-size:13px;
  min-height:18px;
  margin:0 0 8px;
  display:block
}

@media(max-width:390px){
  .app{
    padding-left:8px;
    padding-right:8px
  }

  .turn{
    width:70px;
    height:70px;
    font-size:29px
  }

  .pair{
    grid-template-columns:repeat(3,70px);
    grid-template-rows:70px 70px
  }

  .brand{
    font-size:22px
  }

  .score .playerName{
    font-size:10px;
    max-width:76px
  }
}

/* ===== LIGHT DUEL 6-FEATURE UPGRADE ===== */

.copyBtn{
  margin:4px auto 14px;
  display:block;
  background:#2fd8ff;
  color:#071018;
  min-height:48px;
  font-weight:800
}

.copyBtn.copied{
  background:#fff;
  color:#170f2e
}

.roomCodeBox{
  padding:8px 0 2px
}

.speedBadge{
  display:none;
  margin:8px auto 0;
  width:max-content;
  max-width:100%;
  padding:5px 10px;
  border-radius:999px;
  background:#1b122b;
  border:1px solid #40345a;
  color:#d8d1e8;
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px
}

.speedBadge.live{
  display:block
}

.celebration{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:30
}

.confetti{
  position:absolute;
  top:-24px;
  width:8px;
  height:14px;
  border-radius:2px;
  animation:fall 2.2s linear forwards
}

@keyframes fall{
  0%{
    transform:translateY(-30px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(900px) rotate(720deg);
    opacity:0
  }
}

.winTitle{
  animation:pop .55s ease-out
}

@keyframes pop{
  0%{
    transform:scale(.55);
    opacity:0
  }

  70%{
    transform:scale(1.1)
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

.matchPanel{
  padding:8px 0
}

.matchEmoji{
  font-size:48px;
  line-height:1;
  margin:4px 0 12px
}

@media(max-width:390px){
  .copyBtn{
    width:100%
  }

  .panel h2{
    font-size:28px
  }

  .matchEmoji{
    font-size:42px
  }
}

@media(prefers-reduced-motion:reduce){
  .confetti,
  .winTitle{
    animation:none
  }
}
</style>
</head>

<body>
<main class="app">

<div class="head">
  <div class="brand">LIGHT DUEL</div>
  <div class="status" id="status">CONNECTING</div>
</div>

<div class="scores">
  <div class="score c">
    <div>
      <span>CYAN · P1</span>
      <div class="playerName" id="name0"></div>
    </div>
    <b id="s0">0</b>
  </div>

  <div class="score o">
    <div>
      <span>ORANGE · P2</span>
      <div class="playerName" id="name1"></div>
    </div>
    <b id="s1">0</b>
  </div>
</div>

<div class="board">

  <canvas id="game" width="880" height="880"></canvas>

  <div class="celebration" id="celebration"></div>

  <div class="overlay" id="overlay">

    <div class="panel">

      <h2 id="title">LIGHT DUEL</h2>

      <p id="desc">
        Create a room or join a friend's room.
      </p>

      <div id="home">

        <input
          class="input"
          id="nameInput"
          maxlength="16"
          placeholder="Enter your name"
          autocomplete="off"
        >

        <div id="nameError" class="nameError"></div>

        <div class="row">
          <button class="btn primary" id="create" type="button">
            CREATE ROOM
          </button>

          <button class="btn primary" id="showJoin" type="button">
            JOIN ROOM
          </button>
        </div>

      </div>

      <div id="joinBox" style="display:none">

        <input
          class="input"
          id="roomInput"
          maxlength="4"
          placeholder="ROOM CODE"
          autocomplete="off"
        >

        <div class="row">
          <button class="btn" id="back" type="button">
            BACK
          </button>

          <button class="btn primary" id="join" type="button">
            JOIN
          </button>
        </div>

      </div>

      <div id="roomBox" style="display:none">

        <p>Your room code</p>

        <div class="roomCodeBox">
          <div
            class="big"
            id="roomCode"
            style="font-size:46px;letter-spacing:5px"
          ></div>
        </div>

        <button class="btn copyBtn" id="copyCode" type="button">
          📋 COPY CODE
        </button>

        <p id="wait">
          Waiting for Player 2…
        </p>

      </div>

      <div id="resultBox" style="display:none">

        <button class="btn primary" id="next" type="button">
          NEXT ROUND
        </button>

      </div>

    </div>
  </div>
</div>

<div class="speedBadge" id="speedBadge">
  ⚡ SPEED RISING
</div>

<!-- V2 FOUR-DIRECTION CONTROLS -->

<div class="controls">

  <div
    class="pair"
    id="cyanControls"
    style="display:none"
  >

    <button
      class="turn c up"
      data-p="0"
      data-d="U"
      type="button"
      aria-label="Cyan move up"
    >⬆</button>

    <button
      class="turn c left"
      data-p="0"
      data-d="L"
      type="button"
      aria-label="Cyan move left"
    >⬅</button>

    <button
      class="turn c down"
      data-p="0"
      data-d="D"
      type="button"
      aria-label="Cyan move down"
    >⬇</button>

    <button
      class="turn c right"
      data-p="0"
      data-d="R"
      type="button"
      aria-label="Cyan move right"
    >➡</button>

  </div>

  <div
    class="pair"
    id="orangeControls"
    style="display:none"
  >

    <button
      class="turn o up"
      data-p="1"
      data-d="U"
      type="button"
      aria-label="Orange move up"
    >⬆</button>

    <button
      class="turn o left"
      data-p="1"
      data-d="L"
      type="button"
      aria-label="Orange move left"
    >⬅</button>

    <button
      class="turn o down"
      data-p="1"
      data-d="D"
      type="button"
      aria-label="Orange move down"
    >⬇</button>

    <button
      class="turn o right"
      data-p="1"
      data-d="R"
      type="button"
      aria-label="Orange move right"
    >➡</button>

  </div>

</div>

<div class="voiceBox">
  <button class="voiceBtn" id="voiceBtn" type="button" disabled>🎙️ VOICE OFF</button>
  <span class="voiceStatus" id="voiceStatus">VOICE OFF</span>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<div class="hint">
  <span>CYAN: W / A / S / D</span>
  <span>ORANGE: ARROW KEYS</span>
</div>

</main>

<script>
(function(){

'use strict';

const N=44,
CELL=20,
canvas=document.getElementById('game'),
ctx=canvas.getContext('2d'),
overlay=document.getElementById('overlay'),
title=document.getElementById('title'),
desc=document.getElementById('desc'),
status=document.getElementById('status'),
home=document.getElementById('home'),
joinBox=document.getElementById('joinBox'),
roomBox=document.getElementById('roomBox'),
resultBox=document.getElementById('resultBox'),
roomInput=document.getElementById('roomInput'),
roomCode=document.getElementById('roomCode'),
waitText=document.getElementById('wait'),
s0=document.getElementById('s0'),
s1=document.getElementById('s1'),
nameInput=document.getElementById('nameInput'),
nameError=document.getElementById('nameError'),
name0=document.getElementById('name0'),
name1=document.getElementById('name1');

let ws=null,
myPlayer=null,
statePlayers=[],
phase='home',
pendingMessage=null,
soundCtx=null,
roundStart=0;

const celebration=document.getElementById('celebration');
const speedBadge=document.getElementById('speedBadge');
const copyCodeBtn=document.getElementById('copyCode');

let playerNames=['',''];

/* ===== WEBRTC VOICE CHAT ===== */
let voiceOn=false;
let voiceReady=[false,false];
let voicePc=null;
let voiceStream=null;
let pendingIce=[];
const voiceBtn=document.getElementById('voiceBtn');
const voiceStatus=document.getElementById('voiceStatus');
const remoteAudio=document.getElementById('remoteAudio');

function setVoiceStatus(textValue, kind=''){
  voiceStatus.textContent=textValue;
  voiceStatus.className='voiceStatus'+(kind?' '+kind:'');
}

function closeVoiceConnection(){
  if(voicePc){
    try{voicePc.onicecandidate=null;voicePc.ontrack=null;voicePc.close();}catch(e){}
  }
  voicePc=null;
  pendingIce=[];
  if(voiceStream){
    voiceStream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});
  }
  voiceStream=null;
  remoteAudio.srcObject=null;
}

function voiceSupported(){
  return !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function resetVoice(){
  voiceOn=false;
  voiceReady=[false,false];
  closeVoiceConnection();
  voiceBtn.textContent='🎙️ VOICE OFF';
  voiceBtn.classList.remove('on');
  voiceBtn.disabled=true;
  setVoiceStatus('VOICE OFF');
}

function maybeStartVoice(){
  if(!voiceOn || myPlayer!==0 || !voiceReady[0] || !voiceReady[1])return;
  if(voicePc)return;
  startVoiceOffer();
}

async function createVoicePeer(){
  if(voicePc)return voicePc;
  voicePc=new RTCPeerConnection({
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'}
    ]
  });

  voicePc.onicecandidate=e=>{
    if(e.candidate){
      send({type:'voice-ice',candidate:e.candidate});
    }
  };

  voicePc.ontrack=e=>{
    if(e.streams&&e.streams[0]){
      remoteAudio.srcObject=e.streams[0];
      remoteAudio.play().catch(()=>{});
    }
  };

  voicePc.onconnectionstatechange=()=>{
    if(!voicePc)return;
    const st=voicePc.connectionState;
    if(st==='connected')setVoiceStatus('VOICE ON','on');
    if(st==='failed'){
      setVoiceStatus('VOICE CONNECTION FAILED','error');
    }
    if(st==='disconnected')setVoiceStatus('VOICE DISCONNECTED','error');
  };

  if(voiceStream){
    voiceStream.getTracks().forEach(track=>voicePc.addTrack(track,voiceStream));
  }
  return voicePc;
}

async function startVoiceOffer(){
  try{
    const pc=await createVoicePeer();
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    send({type:'voice-offer',offer:pc.localDescription});
    setVoiceStatus('CONNECTING VOICE…');
  }catch(e){
    console.error(e);
    setVoiceStatus('VOICE SETUP FAILED','error');
  }
}

async function handleVoiceOffer(offer){
  if(!voiceOn)return;
  try{
    const pc=await createVoicePeer();
    await pc.setRemoteDescription(offer);
    for(const candidate of pendingIce){
      try{await pc.addIceCandidate(candidate);}catch(e){}
    }
    pendingIce=[];
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({type:'voice-answer',answer:pc.localDescription});
    setVoiceStatus('CONNECTING VOICE…');
  }catch(e){
    console.error(e);
    setVoiceStatus('VOICE SETUP FAILED','error');
  }
}

async function handleVoiceAnswer(answer){
  if(!voicePc || !voiceOn)return;
  try{
    await voicePc.setRemoteDescription(answer);
    for(const candidate of pendingIce){
      try{await voicePc.addIceCandidate(candidate);}catch(e){}
    }
    pendingIce=[];
  }catch(e){
    console.error(e);
    setVoiceStatus('VOICE SETUP FAILED','error');
  }
}

async function handleVoiceIce(candidate){
  if(!voiceOn)return;
  if(!voicePc || !voicePc.remoteDescription){
    pendingIce.push(candidate);
    return;
  }
  try{await voicePc.addIceCandidate(candidate);}catch(e){}
}

async function turnVoiceOn(){
  if(myPlayer===null)return;
  if(!voiceSupported()){
    setVoiceStatus('VOICE NOT SUPPORTED','error');
    return;
  }
  try{
    voiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
    voiceOn=true;
    voiceReady[myPlayer]=true;
    voiceBtn.textContent='🔇 VOICE ON';
    voiceBtn.classList.add('on');
    voiceBtn.disabled=false;
    setVoiceStatus('MIC ON','on');
    send({type:'voice-ready'});
    maybeStartVoice();
  }catch(e){
    console.error(e);
    voiceOn=false;
    voiceReady[myPlayer]=false;
    setVoiceStatus(e&&e.name==='NotAllowedError'?'MIC PERMISSION DENIED':'MIC UNAVAILABLE','error');
  }
}

function turnVoiceOff(notify=true){
  if(myPlayer!==null)voiceReady[myPlayer]=false;
  voiceOn=false;
  if(notify)send({type:'voice-off'});
  closeVoiceConnection();
  voiceBtn.textContent='🎙️ VOICE OFF';
  voiceBtn.classList.remove('on');
  setVoiceStatus('VOICE OFF');
}

function updateVoiceAvailability(){
  voiceBtn.disabled=!(myPlayer!==null && ws && ws.readyState===WebSocket.OPEN && voiceSupported());
}

function sound(type){

  try{

    if(!soundCtx){
      soundCtx=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }

    if(soundCtx.state==='suspended'){
      soundCtx.resume();
    }

    const o=soundCtx.createOscillator();
    const g=soundCtx.createGain();
    const now=soundCtx.currentTime;

    const sets={
      count:[520,.11],
      go:[760,.16],
      crash:[120,.28],
      win:[920,.22],
      copy:[660,.08]
    };

    const q=sets[type]||[440,.1];

    o.frequency.setValueAtTime(q[0],now);

    o.frequency.exponentialRampToValueAtTime(
      type==='crash'?70:q[0]*1.35,
      now+q[1]
    );

    g.gain.setValueAtTime(.0001,now);

    g.gain.exponentialRampToValueAtTime(
      .18,
      now+.01
    );

    g.gain.exponentialRampToValueAtTime(
      .0001,
      now+q[1]
    );

    o.connect(g);
    g.connect(soundCtx.destination);

    o.start(now);
    o.stop(now+q[1]+.02);

  }catch(e){}

}

function clearCelebration(){

  celebration.innerHTML='';
  title.classList.remove('winTitle');

}

function celebrate(match){

  clearCelebration();

  const pieces=[
    '🎉',
    '✨',
    '⭐',
    '🏆',
    '🔥',
    '🎊'
  ];

  for(let i=0;i<42;i++){

    const x=document.createElement('div');

    x.className='confetti';
    x.textContent=pieces[i%pieces.length];

    x.style.left=(Math.random()*100)+'%';
    x.style.animationDelay=(Math.random()*.7)+'s';
    x.style.fontSize=(10+Math.random()*14)+'px';

    celebration.appendChild(x);

  }

  title.classList.add('winTitle');
  sound('win');

}

function showMatchVictory(){

  show(
    'MATCH VICTORY',
    'You reached 5 wins!'
  );

  resultBox.style.display='block';

  document.getElementById('next').textContent='PLAY AGAIN';

  desc.textContent=
    '🏆 You are the Light Duel champion!';

}

function wsUrl(){

  return(
    location.protocol==='https:'?
    'wss://':
    'ws://'
  )+location.host;

}

function sanitizeName(value){

  const name=(value||'').trim();

  if(!name)return '';

  return name.slice(0,16);

}

function validateName(){

  const name=sanitizeName(nameInput.value);

  if(!name){

    nameError.textContent=
      'Please enter your name.';

    nameInput.focus();

    return false;

  }

  if(name.length>16){

    nameError.textContent=
      'Name must be 16 characters or less.';

    nameInput.focus();

    return false;

  }

  nameError.textContent='';

  return true;

}

function send(m){

  if(
    ws&&
    ws.readyState===WebSocket.OPEN
  ){

    ws.send(JSON.stringify(m));

    return true;

  }

  pendingMessage=m;

  return false;

}

function connect(m){

  if(m)pendingMessage=m;

  if(
    ws&&
    (
      ws.readyState===WebSocket.OPEN||
      ws.readyState===WebSocket.CONNECTING
    )
  )return;

  status.textContent='CONNECTING…';

  try{

    ws=new WebSocket(wsUrl());

  }catch(e){

    status.textContent='CONNECTION ERROR';

    return;

  }

  ws.onopen=function(){

    status.textContent='CONNECTED';

    if(pendingMessage){

      const x=pendingMessage;

      pendingMessage=null;

      ws.send(JSON.stringify(x));

    }

  };

  ws.onmessage=function(e){

    try{

      handle(JSON.parse(e.data));

    }catch(err){

      console.error(err);

    }

  };

  ws.onerror=function(){

    status.textContent='CONNECTION ERROR';

  };

  ws.onclose=function(){

    resetVoice();
    status.textContent='OFFLINE';

    if(phase==='play'){

      show(
        'CONNECTION LOST',
        'Reload the page to reconnect.'
      );

    }

    ws=null;

  };

}

function show(t,d){

  title.textContent=t;
  desc.textContent=d;

  home.style.display='none';
  joinBox.style.display='none';
  roomBox.style.display='none';
  resultBox.style.display='none';

  overlay.classList.remove('hidden');

}

function updatePlayerNames(){

  name0.textContent=playerNames[0]||'';
  name1.textContent=playerNames[1]||'';

}

function handle(m){

  if(m.type==='room'){

    myPlayer=m.player;

    playerNames=
      m.playerNames||['',''];

    updatePlayerNames();
    updateControls();
    resetVoice();
    updateVoiceAvailability();

    roomCode.textContent=m.code;

    clearCelebration();

    speedBadge.classList.remove('live');

    waitText.textContent=
      'Waiting for Player 2…';

    show(
      'ROOM '+m.code,
      'Share this code with Player 2.'
    );

    roomBox.style.display='block';

  }

  if(m.type==='waiting'){

    show(
      'WAITING',
      'Player 2 can join with your room code.'
    );

    roomBox.style.display='block';

  }

  if(m.type==='connected'){

    updateVoiceAvailability();

    playerNames=
      m.playerNames||['',''];

    updatePlayerNames();

    waitText.textContent=
      'Player 2 connected! Get ready…';

  }

  if(m.type==='round'){

    statePlayers=m.players||[];

    playerNames=
      m.playerNames||['',''];

    updatePlayerNames();

    setScore(
      m.scores||[0,0]
    );

    roundStart=performance.now();

    speedBadge.classList.remove('live');

    clearCelebration();

    show(
      String(m.count),
      'GET READY'
    );

    sound('count');

  }

  if(m.type==='count'){

    title.textContent=
      String(m.count);

    desc.textContent=
      'GET READY';

    sound('count');

  }

  if(m.type==='go'){

    phase='play';

    roundStart=performance.now();

    speedBadge.classList.add('live');

    overlay.classList.add('hidden');

    sound('go');

  }

  if(m.type==='state'){

    statePlayers=m.players||[];

    playerNames=
      m.playerNames||['',''];

    updatePlayerNames();

    setScore(
      m.scores||[0,0]
    );

  }

  if(m.type==='result'){

    statePlayers=m.players||[];

    playerNames=
      m.playerNames||['',''];

    updatePlayerNames();

    setScore(
      m.scores||[0,0]
    );

    phase='result';

    speedBadge.classList.remove('live');

    const head=!!m.headOn;
    const won=m.winner===myPlayer;

    clearCelebration();

    if(head){

      show(
        'DOUBLE CRASH',
        'Nobody scores this round.'
      );

      sound('crash');

    }else if(m.matchOver&&won){

      showMatchVictory();
      celebrate(true);

    }else if(won){

      const wins=[
        '🎉 ROUND WIN! 🎉',
        '🏆 GREAT RUN! 🏆',
        '⚡ DOMINATED! ⚡',
        '🔥 LIGHT DUEL WIN! 🔥',
        '👑 YOU GOT IT! 👑'
      ];

      show(
        wins[
          Math.floor(
            Math.random()*wins.length
          )
        ],
        'Score '+m.scores[0]+' – '+m.scores[1]
      );

      celebrate(false);

    }else{

      show(
        'ROUND LOST',
        'Score '+m.scores[0]+' – '+m.scores[1]
      );

      sound('crash');

    }

    resultBox.style.display='block';

    document.getElementById('next').textContent=
      m.matchOver?
      'PLAY AGAIN':
      'NEXT ROUND';

  }

  if(m.type==='voice-ready'){
    if(m.player!==undefined && m.player!==myPlayer){
      voiceReady[m.player]=true;
      if(voiceOn)maybeStartVoice();
    }
  }

  if(m.type==='voice-off'){
    if(m.player!==undefined && m.player!==myPlayer){
      voiceReady[m.player]=false;
      if(voiceOn){
        closeVoiceConnection();
        setVoiceStatus('OPPONENT VOICE OFF');
      }
    }
  }

  if(m.type==='voice-offer'){
    handleVoiceOffer(m.offer);
  }

  if(m.type==='voice-answer'){
    handleVoiceAnswer(m.answer);
  }

  if(m.type==='voice-ice'){
    handleVoiceIce(m.candidate);
  }

  if(m.type==='voice-peer-left'){
    voiceReady=[false,false];
    if(voiceOn){
      closeVoiceConnection();
      setVoiceStatus('OPPONENT LEFT VOICE');
    }
  }

  if(m.type==='opponent_left'){

    resetVoice();
    show(
      'OPPONENT LEFT',
      'The room has ended. Reload to create a new room.'
    );

  }

  if(m.type==='error'){

    show(
      'ERROR',
      m.message||'Something went wrong.'
    );

    home.style.display='block';

  }

}

function setScore(s){

  s0.textContent=
    Number(s[0]||0);

  s1.textContent=
    Number(s[1]||0);

}

function updateControls(){

  document.getElementById(
    'cyanControls'
  ).style.display=
    myPlayer===0?'grid':'none';

  document.getElementById(
    'orangeControls'
  ).style.display=
    myPlayer===1?'grid':'none';

}

function draw(){

  ctx.fillStyle='#170f2e';

  ctx.fillRect(
    0,
    0,
    880,
    880
  );

  ctx.strokeStyle=
    'rgba(255,255,255,.045)';

  for(let i=1;i<N;i++){

    let x=i*CELL+.5;

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,880);
    ctx.stroke();

    let y=i*CELL+.5;

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(880,y);
    ctx.stroke();

  }

  statePlayers.forEach(function(p,i){

    if(!p)return;

    const col=
      i===0?
      '#2fd8ff':
      '#ffa81f';

    const trail=
      Array.isArray(p.trail)?
      p.trail:
      [];

    ctx.save();

    ctx.shadowColor=col;
    ctx.shadowBlur=13;
    ctx.fillStyle=col;

    trail.forEach(function(c,k){

      if(
        !Array.isArray(c)||
        c.length<2
      )return;

      ctx.globalAlpha=
        .2+
        .8*
        (
          (k+1)/
          Math.max(1,trail.length)
        );

      ctx.fillRect(
        c[0]*CELL+4,
        c[1]*CELL+4,
        12,
        12
      );

    });

    if(
      Number.isFinite(p.x)&&
      Number.isFinite(p.y)
    ){

      ctx.globalAlpha=1;

      ctx.fillStyle='#fff';

      ctx.shadowColor='#fff';
      ctx.shadowBlur=18;

      ctx.fillRect(
        p.x*CELL+3,
        p.y*CELL+3,
        14,
        14
      );

    }

    ctx.restore();

  });

}

function loop(){

  draw();

  if(
    phase==='play'&&
    roundStart&&
    performance.now()-roundStart>7000
  ){

    speedBadge.classList.add('live');

  }

  requestAnimationFrame(loop);

}

/* ===== CREATE ROOM ===== */

document.getElementById('create')
.addEventListener(
  'click',
  ()=>{

    if(!validateName())return;

    const n=
      sanitizeName(
        nameInput.value
      );

    status.textContent=
      'CONNECTING…';

    connect({
      type:'create',
      name:n
    });

  }
);

/* ===== SHOW JOIN ===== */

document.getElementById('showJoin')
.addEventListener(
  'click',
  ()=>{

    if(!validateName())return;

    home.style.display='none';

    joinBox.style.display='block';

    title.textContent='JOIN ROOM';

    desc.textContent=
      "Enter your friend's 4-character code.";

    roomInput.focus();

  }
);

/* ===== BACK ===== */

document.getElementById('back')
.addEventListener(
  'click',
  ()=>{

    joinBox.style.display='none';

    home.style.display='block';

    title.textContent='LIGHT DUEL';

    desc.textContent=
      "Create a room or join a friend's room.";

    nameError.textContent='';

  }
);

/* ===== JOIN ===== */

document.getElementById('join')
.addEventListener(
  'click',
  ()=>{

    const c=
      roomInput.value
      .trim()
      .toUpperCase();

    if(c.length!==4){

      desc.textContent=
        'Enter the 4-character room code.';

      roomInput.focus();

      return;

    }

    if(!validateName())return;

    status.textContent=
      'CONNECTING…';

    connect({
      type:'join',
      code:c,
      name:sanitizeName(
        nameInput.value
      )
    });

  }
);

/* ===== NEXT ROUND ===== */

document.getElementById('next')
.addEventListener(
  'click',
  ()=>{

    clearCelebration();

    send({
      type:'next'
    });

    phase='play';

    overlay.classList.add('hidden');

    sound('go');

  }
);

/* ===== COPY ROOM CODE ===== */

copyCodeBtn.addEventListener(
  'click',
  async()=>{

    const code=
      roomCode.textContent.trim();

    if(!code)return;

    try{

      await navigator.clipboard.writeText(code);

      copyCodeBtn.textContent=
        '✅ COPIED!';

      copyCodeBtn.classList.add('copied');

      sound('copy');

      setTimeout(
        ()=>{
          copyCodeBtn.textContent=
            '📋 COPY CODE';

          copyCodeBtn.classList.remove(
            'copied'
          );
        },
        1600
      );

    }catch(e){

      copyCodeBtn.textContent=
        'CODE: '+code;

      setTimeout(
        ()=>copyCodeBtn.textContent=
          '📋 COPY CODE',
        1800
      );

    }

  }
);

/* ===== VOICE CHAT BUTTON ===== */
voiceBtn.addEventListener('click',async()=>{
  if(!voiceOn)await turnVoiceOn();
  else turnVoiceOff(true);
});

/* ===== FOUR-DIRECTION TOUCH CONTROLS ===== */

document
.querySelectorAll('.turn')
.forEach(
  b=>b.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      if(
        myPlayer!==null&&
        Number(b.dataset.p)===myPlayer
      ){

        send({
          type:'turn',
          dir:b.dataset.d
        });

      }

    }
  )
);

/* ===== KEYBOARD CONTROLS ===== */

document.addEventListener(
  'keydown',
  e=>{

    if(e.repeat)return;

    const key=e.key.toLowerCase();

    /* CYAN — W A S D */

    if(myPlayer===0){

      if(key==='w'){
        send({
          type:'turn',
          dir:'U'
        });
      }

      if(key==='a'){
        send({
          type:'turn',
          dir:'L'
        });
      }

      if(key==='s'){
        send({
          type:'turn',
          dir:'D'
        });
      }

      if(key==='d'){
        send({
          type:'turn',
          dir:'R'
        });
      }

    }

    /* ORANGE — ARROW KEYS */

    if(myPlayer===1){

      if(e.key==='ArrowUp'){
        send({
          type:'turn',
          dir:'U'
        });
      }

      if(e.key==='ArrowDown'){
        send({
          type:'turn',
          dir:'D'
        });
      }

      if(e.key==='ArrowLeft'){
        send({
          type:'turn',
          dir:'L'
        });
      }

      if(e.key==='ArrowRight'){
        send({
          type:'turn',
          dir:'R'
        });
      }

    }

  }
);

updateVoiceAvailability();
draw();
loop();

})();
</script>
