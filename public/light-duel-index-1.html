<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Light Duel — Online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800&display=swap');
:root{--bg:#090612;--panel:#120b21;--violet:#170f2e;--cyan:#2fd8ff;--orange:#ffa81f;--muted:#9d96b3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}.app{width:min(100%,720px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}h1,.big{font-family:Bungee,Impact,sans-serif}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-family:Bungee;font-size:25px}.status{font-size:12px;color:var(--muted)}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.score{padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid #312746;display:flex;justify-content:space-between;align-items:center}.score.c{border-color:#2fd8ff66}.score.o{border-color:#ffa81f66}.c{color:var(--cyan)}.o{color:var(--orange)}.score b{font-family:Bungee;font-size:24px}.board{position:relative;aspect-ratio:1;background:var(--violet);border-radius:14px;overflow:hidden;border:1px solid #32264d}.board canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0d081dcc;padding:20px}.hidden{display:none}.panel{width:min(92%,420px)}.panel h2{font-family:Bungee;font-size:32px;margin:0 0 10px}.panel p{color:#bdb6cf;margin:0 0 16px}.btn{min-height:52px;border:0;border-radius:12px;padding:0 20px;font:800 16px Outfit;cursor:pointer}.primary{background:#fff;color:#170f2e}.input{width:100%;height:52px;border-radius:12px;border:1px solid #46395e;background:#181027;color:#fff;padding:0 15px;font:600 17px Outfit;text-align:center;letter-spacing:4px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.turn{height:72px;border-radius:14px;background:#171025;border:1px solid #40345a;font-size:36px;font-weight:900;touch-action:manipulation;color:#fff}.turn.c{color:var(--cyan);border-color:#2fd8ff77}.turn.o{color:var(--orange);border-color:#ffa81f77}.turn:active{transform:scale(.97)}.hint{display:flex;justify-content:space-between;font-size:11px;color:#827a98;margin-top:7px;padding:0 3px}@media(max-width:390px){.app{padding-left:8px;padding-right:8px}.turn{height:72px}.brand{font-size:22px}}
</style>
</head>
<body>
<main class="app">
<div class="head"><div class="brand">LIGHT DUEL</div><div class="status" id="status">CONNECTING</div></div>
<div class="scores"><div class="score c"><span>CYAN · P1</span><b id="s0">0</b></div><div class="score o"><span>ORANGE · P2</span><b id="s1">0</b></div></div>
<div class="board"><canvas id="game" width="880" height="880"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="title">LIGHT DUEL</h2><p id="desc">Create a room or join a friend's room.</p><div id="home"><div class="row"><button class="btn primary" id="create" type="button">CREATE ROOM</button><button class="btn primary" id="showJoin" type="button">JOIN ROOM</button></div></div><div id="joinBox" style="display:none"><input class="input" id="roomInput" maxlength="4" placeholder="ROOM CODE" autocomplete="off"><div class="row"><button class="btn" id="back" type="button">BACK</button><button class="btn primary" id="join" type="button">JOIN</button></div></div><div id="roomBox" style="display:none"><p>Your room code</p><div class="big" id="roomCode" style="font-size:46px;letter-spacing:5px"></div><p id="wait">Waiting for Player 2…</p></div><div id="resultBox" style="display:none"><button class="btn primary" id="next" type="button">NEXT ROUND</button></div></div></div></div>
<div class="controls"><div class="pair"><button class="turn c" data-p="0" data-d="L" type="button" aria-label="Cyan turn left">↰</button><button class="turn c" data-p="0" data-d="R" type="button" aria-label="Cyan turn right">↱</button></div><div class="pair"><button class="turn o" data-p="1" data-d="L" type="button" aria-label="Orange turn left">↰</button><button class="turn o" data-p="1" data-d="R" type="button" aria-label="Orange turn right">↱</button></div></div>
<div class="hint"><span>CYAN: A / D</span><span>ORANGE: ← / →</span></div>
</main>
<script>
(function(){'use strict';const N=44,CELL=20,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),desc=document.getElementById('desc'),status=document.getElementById('status'),home=document.getElementById('home'),joinBox=document.getElementById('joinBox'),roomBox=document.getElementById('roomBox'),resultBox=document.getElementById('resultBox'),roomInput=document.getElementById('roomInput'),roomCode=document.getElementById('roomCode'),waitText=document.getElementById('wait'),s0=document.getElementById('s0'),s1=document.getElementById('s1');let ws=null,myPlayer=null,statePlayers=[],phase='home',pendingMessage=null;
function wsUrl(){return(location.protocol==='https:'?'wss://':'ws://')+location.host}function send(m){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(m));return true}pendingMessage=m;return false}function connect(m){if(m)pendingMessage=m;if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;status.textContent='CONNECTING…';try{ws=new WebSocket(wsUrl())}catch(e){status.textContent='CONNECTION ERROR';return}ws.onopen=function(){status.textContent='CONNECTED';if(pendingMessage){const x=pendingMessage;pendingMessage=null;ws.send(JSON.stringify(x))}};ws.onmessage=function(e){try{handle(JSON.parse(e.data))}catch(err){console.error(err)}};ws.onerror=function(){status.textContent='CONNECTION ERROR'};ws.onclose=function(){status.textContent='OFFLINE';if(phase==='play')show('CONNECTION LOST','Reload the page to reconnect.');ws=null}}
function show(t,d){title.textContent=t;desc.textContent=d;home.style.display='none';joinBox.style.display='none';roomBox.style.display='none';resultBox.style.display='none';overlay.classList.remove('hidden')}
function handle(m){if(m.type==='room'){myPlayer=m.player;roomCode.textContent=m.code;waitText.textContent='Waiting for Player 2…';show('ROOM '+m.code,'Share this code with Player 2.');roomBox.style.display='block'}if(m.type==='waiting'){show('WAITING','Player 2 can join with your room code.');roomBox.style.display='block'}if(m.type==='connected'){show('OPPONENT CONNECTED','Get ready…');setTimeout(()=>overlay.classList.add('hidden'),900)}if(m.type==='round'){statePlayers=m.players||[];setScore(m.scores||[0,0]);show(String(m.count),'GET READY')}if(m.type==='count'){title.textContent=String(m.count);desc.textContent='GET READY'}if(m.type==='go'){phase='play';overlay.classList.add('hidden')}if(m.type==='state'){statePlayers=m.players||[];setScore(m.scores||[0,0])}if(m.type==='result'){statePlayers=m.players||[];setScore(m.scores||[0,0]);phase='result';const head=!!m.headOn,won=m.winner===myPlayer;show(head?'DOUBLE CRASH':(won?'ROUND WIN':'ROUND LOST'),head?'Nobody scores this round.':'Score '+m.scores[0]+' – '+m.scores[1]);resultBox.style.display='block';document.getElementById('next').textContent=m.matchOver?'PLAY AGAIN':'NEXT ROUND'}if(m.type==='opponent_left')show('OPPONENT LEFT','The room has ended. Reload to create a new room.');if(m.type==='error'){show('ERROR',m.message||'Something went wrong.');home.style.display='block'}}
function setScore(s){s0.textContent=Number(s[0]||0);s1.textContent=Number(s[1]||0)}function draw(){ctx.fillStyle='#170f2e';ctx.fillRect(0,0,880,880);ctx.strokeStyle='rgba(255,255,255,.045)';for(let i=1;i<N;i++){let x=i*CELL+.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,880);ctx.stroke();let y=i*CELL+.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(880,y);ctx.stroke()}statePlayers.forEach(function(p,i){if(!p)return;const col=i===0?'#2fd8ff':'#ffa81f',trail=Array.isArray(p.trail)?p.trail:[];ctx.save();ctx.shadowColor=col;ctx.shadowBlur=13;ctx.fillStyle=col;trail.forEach(function(c,k){if(!Array.isArray(c)||c.length<2)return;ctx.globalAlpha=.2+.8*((k+1)/Math.max(1,trail.length));ctx.fillRect(c[0]*CELL+4,c[1]*CELL+4,12,12)});if(Number.isFinite(p.x)&&Number.isFinite(p.y)){ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.fillRect(p.x*CELL+3,p.y*CELL+3,14,14)}ctx.restore()})}function loop(){draw();requestAnimationFrame(loop)}
document.getElementById('create').addEventListener('click',()=>{status.textContent='CONNECTING…';connect({type:'create'})});document.getElementById('showJoin').addEventListener('click',()=>{home.style.display='none';joinBox.style.display='block';title.textContent='JOIN ROOM';desc.textContent="Enter your friend's 4-character code.";roomInput.focus()});document.getElementById('back').addEventListener('click',()=>{joinBox.style.display='none';home.style.display='block';title.textContent='LIGHT DUEL';desc.textContent="Create a room or join a friend's room."});document.getElementById('join').addEventListener('click',()=>{const c=roomInput.value.trim().toUpperCase();if(c.length!==4){desc.textContent='Enter the 4-character room code.';roomInput.focus();return}status.textContent='CONNECTING…';connect({type:'join',code:c})});document.getElementById('next').addEventListener('click',()=>{send({type:'next'});phase='play';overlay.classList.add('hidden')});document.querySelectorAll('.turn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(myPlayer!==null&&Number(b.dataset.p)===myPlayer)send({type:'turn',dir:b.dataset.d})}));document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='a'&&myPlayer===0)send({type:'turn',dir:'L'});if(e.key.toLowerCase()==='d'&&myPlayer===0)send({type:'turn',dir:'R'});if(e.key==='ArrowLeft'&&myPlayer===1)send({type:'turn',dir:'L'});if(e.key==='ArrowRight'&&myPlayer===1)send({type:'turn',dir:'R'})});draw();loop()})();
</script>
</body></html>
